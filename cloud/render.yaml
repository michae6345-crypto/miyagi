services:
  - type: web
    name: miyagi-cloud
    runtime: python
    rootDir: cloud
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: miyagi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PROXY_ENABLED
        value: "true"
      - key: SUPABASE_URL          # POST /v1/link verifies Supabase access tokens against this project's JWKS
        value: https://wssdpsdbaqtnfhoyimit.supabase.co
      - key: SUPABASE_JWT_SECRET   # optional: only for legacy HS256 tokens
        sync: false
      - key: ALLOWED_ANTHROPIC_MODELS
        value: claude-sonnet-5-5,claude-haiku-5-5
      - key: ALLOWED_GEMINI_MODELS
        value: gemini-3.8-flash
      - key: MAX_TOKENS_CAP
        value: "4096"
      - key: DB_PATH
        value: /var/data/miyagi.db
      - key: FREE_LESSON_BUILDS_PER_MONTH
        value: "3"
      - key: FREE_COACH_CALLS_PER_DAY
        value: "60"
      - key: DAILY_USD_CAP         # spend kill switch in dollars per UTC day, every install together; empty = off
        sync: false
