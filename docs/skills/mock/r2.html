<script>
const q = new URLSearchParams(location.search);
const S = q.get('s') || 'path', T = q.get('t') || 'light';
document.body.className = T;
const dark = T === 'dark';
const A = n => 'assets/' + n + (dark ? '-dark' : '') + '.svg';
document.querySelectorAll('img[data-src]').forEach(i => { i.src = A(i.dataset.src); });
const $ = s => document.querySelector(s);
const view = { map: 'map', zoom: 'map' }[S] || 'path';
document.querySelectorAll('#seg b').forEach(b => b.classList.toggle('on', b.dataset.v === view));
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);

}
function div(cls, html, parent) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; (parent || $('#canvas')).appendChild(d); return d; }
const done = s => s === 'mastered' || s === 'review';

// ---------- one edge style: a rounded elbow ----------
// LR (Path): out sideways, one vertical run in the gap between columns, in sideways. BU (Map): up, one level run between rows, up.
function hEdge(a, b, ra, rb, bend) {
  const x0 = a.x + ra, x1 = b.x - rb;

  const mx = bend === 's' ? x0 + 24 : bend === 't' ? x1 - 24 : (x0 + x1) / 2, R = Math.min(20, Math.abs(b.y - a.y) / 2, (x1 - x0) / 2), d = b.y > a.y ? 1 : -1;
  return `M${x0} ${a.y}H${mx - R}Q${mx} ${a.y} ${mx} ${a.y + d * R}V${b.y - d * R}Q${mx} ${b.y} ${mx + R} ${b.y}H${x1}`;
}
function vEdge(a, b, ra, rb) {
  const y0 = a.y - ra, y1 = b.y + rb;
  if (Math.abs(a.x - b.x) < 1) return `M${a.x} ${y0}V${y1}`;
  const my = (y0 + y1) / 2, R = Math.min(18, Math.abs(b.x - a.x) / 2, (y0 - y1) / 2), d = b.x > a.x ? 1 : -1;
  return `M${a.x} ${y0}V${my + R}Q${a.x} ${my} ${a.x + d * R} ${my}H${b.x - d * R}Q${b.x} ${my} ${b.x} ${my - R}V${y1}`;
}
function edgeKind(a, b) {
  if (done(a.s) && done(b.s)) return 'done';
  if (done(a.s) && (b.s === 'practicing' || b.s === 'ready')) return 'open';
  return 'locked';
}
const EDGE = {
  done: { stroke: 'var(--green)', 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' },
  open: { stroke: 'var(--ink)', 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' },
  locked: { stroke: 'var(--faint)', 'stroke-width': 1.6, fill: 'none', 'stroke-dasharray': '1.5 6', 'stroke-linecap': 'round' },
  fresh: { stroke: 'var(--ink)', 'stroke-width': 1.8, fill: 'none', 'stroke-dasharray': '2 6', 'stroke-linecap': 'round' }
};
const half = (n, r) => n.kind === 'hero' ? 0 : n.kind === 'cap' ? (n.r || r) + 4 : (n.r || r) + (n.next ? 8 : 2);

function miniTree(w, h, o = {}) {
  const { N, E } = mapData(0, 0, { cp: o.cp || 58, rp: o.rp || 29, x0: 0, y0: 0 });
  let xs = [], ys = []; for (const id in N) { xs.push(N[id].x); ys.push(N[id].y); }
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys) - (o.rp || 29), maxy = Math.max(...ys);
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', `${minx - 14} ${miny - 14} ${maxx - minx + 28} ${maxy - miny + 28}`); s.setAttribute('width', w); s.setAttribute('height', h);
  const ge = el('g', {}, s), gn = el('g', {}, s), r = o.r || 6.5;
  N.goal = { x: N.grad.x, y: N.grad.y - (o.rp || 29), s: 'locked', kind: 'cap' }; E.push(['grad', 'goal']);
  for (const [a, b] of E) { const k = edgeKind(N[a], N[b]); el('path', { d: vEdge(N[a], N[b], 0, 0), fill: 'none', stroke: k === 'done' ? 'var(--green)' : k === 'open' ? 'var(--ink)' : 'var(--ghost)', 'stroke-width': k === 'done' ? 2.2 : 1.4, 'stroke-dasharray': k === 'locked' ? '1.5 4' : 'none', 'stroke-linecap': 'round' }, ge); }
  for (const id in N) { const n = N[id];
    if (n.kind === 'cap') el('rect', { x: n.x - r, y: n.y - r, width: 2 * r, height: 2 * r, rx: 3.6, fill: id === 'goal' ? 'var(--ink)' : 'var(--raised)', stroke: id === 'goal' ? 'var(--ink)' : 'var(--faint)', 'stroke-width': 1.3 }, gn);
    else if (done(n.s)) el('circle', { cx: n.x, cy: n.y, r, fill: 'var(--green)' }, gn);
    else el('circle', { cx: n.x, cy: n.y, r: r - .8, fill: 'var(--raised)', stroke: n.s === 'locked' ? 'var(--faint)' : 'var(--ink)', 'stroke-width': n.s === 'locked' ? 1.2 : 1.7, 'stroke-dasharray': n.s === 'locked' ? '2 2.4' : 'none' }, gn); }
  return s;
}
