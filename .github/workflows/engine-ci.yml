name: engine-ci
# The engine (server/) and miyagi-cloud (cloud/) test suites, offline, on PRs and main pushes that touch them.
# ci.yml runs the wider set (cli, evals, app, gitleaks) on PRs and main; this one is the fast engine-only signal, at the
# Python the engine ships with (scripts/miyagi-engine.sh: `uv venv --python 3.12`). Lane branches pushed without a PR
# get no run here: run the engine checks locally before merging (CI.md). The install loop gates on main's run.
on:
  push:
    branches: [main]
    paths: ["server/**", "shared/**", "cloud/**", ".github/workflows/engine-ci.yml"]
  pull_request:
    paths: ["server/**", "shared/**", "cloud/**", ".github/workflows/engine-ci.yml"]
  workflow_dispatch: {}
# Read-only token; actions pinned to the commit their major tag pointed at, as in ci.yml.
permissions:
  contents: read
# One run per workflow and branch/PR: a newer commit cancels the older run, on main too (it is moot once superseded).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: install
        # `tiger` (psycopg) too: the Tiger writer / spool / stats tests assert behaviour that needs the driver present
        # (dev-only extra, never bundled). Nothing connects: the DSNs in those tests are fakes or closed ports.
        run: pip install -e "server[dev,tiger]" pytest-timeout==2.4.0
      - run: python -c "import server"
      - name: a stand-in `code` on PATH
        # Engine tests look for the VS Code CLI, then hand the command to a recording runner. A do-nothing `code` is
        # all they need to find one.
        run: |
          mkdir -p "$RUNNER_TEMP/editor-stub"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/editor-stub/code"
          chmod +x "$RUNNER_TEMP/editor-stub/code"
          echo "$RUNNER_TEMP/editor-stub" >> "$GITHUB_PATH"
      - name: pytest server
        env:
          PYTHONUTF8: "1"
          # Any request past this machine hits a dead proxy and fails here, instead of passing by luck or reaching a
          # paid API. Servers the tests start on 127.0.0.1 are not proxied.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
        # No model keys, ever (env -u, in case a runner or a later secret sets one). test_screencapture_backend_live is
        # a known-flaky local capture check (a real screenshot of the main display); CI deselects it, locally it runs.
        run: >-
          env -u ANTHROPIC_API_KEY -u GEMINI_API_KEY -u GOOGLE_API_KEY
          python -m pytest server -q -p no:cacheprovider --timeout=120 -ra
          --deselect server/screen/tests/test_capture.py::test_screencapture_backend_live
  cloud:
    # miyagi-cloud's own suite (cloud/tests) at Render's Python. Offline by design: the tests set fake upstream keys and
    # point the upstreams at a closed local port. Branches without cloud/tests skip the step.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: cloud } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: cloud/requirements.txt }
      - name: install
        run: pip install -r requirements.txt pytest==8.4.2 pytest-timeout==2.4.0
      - name: pytest cloud/tests
        if: hashFiles('cloud/tests/**/*.py') != ''
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1,testserver
        run: env -u ANTHROPIC_API_KEY -u GEMINI_API_KEY python -m pytest tests -q -p no:cacheprovider --timeout=120 -ra
      - name: no cloud/tests on this branch
        if: hashFiles('cloud/tests/**/*.py') == ''
        run: echo "cloud/tests not on this branch yet; ci.yml's cloud smoke covers startup."
