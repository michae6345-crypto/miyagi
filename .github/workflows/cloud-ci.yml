name: cloud-ci
# miyagi-cloud tests and a secret scan on every push to the cloud trunks (push to claude/eng-proxy = Render prod deploy)
# and on PRs that touch cloud/. Offline: fake upstream keys, a dead proxy for anything leaving the runner.
on:
  push:
    branches: [claude/eng-proxy, claude/eng-proxy-next]
  pull_request:
    paths: ["cloud/**", ".github/workflows/cloud-ci.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: cloud } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: cloud/requirements.txt }
      - run: pip install -r requirements.txt pytest==8.4.2 pytest-timeout==2.4.0
      - name: pytest cloud/tests
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1,testserver
        run: env -u ANTHROPIC_API_KEY -u GEMINI_API_KEY python -m pytest tests -q -p no:cacheprovider --timeout=120 -ra
  gitleaks:
    # Every commit the branch carries (R46). Findings print redacted; a checked non-secret goes in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: gitleaks 8.30.1 (checksum checked)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_TGZ_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_TGZ_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=HEAD --redact --no-banner -v
      - name: no merge-conflict markers
        run: |
          if git grep -nIE '^(<<<<<<<|>>>>>>>)( |$)'; then echo "merge-conflict markers above"; exit 1; fi
