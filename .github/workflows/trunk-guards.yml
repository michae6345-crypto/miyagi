name: trunk-guards
on:
  push:
    branches: [integration/live, main]
  workflow_dispatch: {}
# Trunk guards (Nov 25 foundations audit, fix #1): ci.yml runs gitleaks and the contract check only on PRs and main,
# but the trunks take direct pushes, so those checks never ran where code ships. This runs them on every trunk push.
permissions:
  contents: read
concurrency:
  group: trunk-guards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    # Every commit the branch carries (R46). Findings print redacted; a checked non-secret goes in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: gitleaks 8.30.1 (checksum checked)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_TGZ_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_TGZ_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=HEAD --redact --no-banner -v
      - name: no merge-conflict markers
        run: |
          if git grep -nIE '^(<<<<<<<|>>>>>>>)( |$)'; then echo "merge-conflict markers above"; exit 1; fi
  contract-parity:
    # events.ts and events.py list the same events, commands and constants.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: pip install "pydantic==2.14.3" && python3 scripts/test_contract_parity.py
