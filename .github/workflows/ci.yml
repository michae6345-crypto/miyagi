name: ci
on: { push: { branches: [main] }, pull_request: {} }
# Least privilege: no job writes to the repo, so the run's GITHUB_TOKEN can only read it. Actions are pinned to the
# commit their major tag pointed at (the tag can be moved; the commit cannot). Tools are pinned to a version.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    # The engine (server/), the tut CLI (cli/) and the scripted-learner replay eval (evals/replay), for real (R04).
    # Offline: no API key, no cloud token. A test known to fail carries an xfail marker with its reason, in its file.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            cli/pyproject.toml
      - name: install
        run: pip install -e "server[dev]" -e cli ruff==0.17.6 pytest-timeout==2.4.0
      - name: ruff (syntax errors, undefined names)
        # Ruff's full default set reports ~700 style findings in server/ today. These four classes are bugs, and none is
        # in the tree, so they block.
        run: ruff check --isolated --select E9,F63,F7,F82 server cli evals scripts cloud
      - run: python -c "import server"
      - name: a stand-in `code` on PATH
        # Many engine tests assume VS Code is installed, as on a dev Mac: they look for the `code` CLI, then hand the
        # command to a recording runner instead of running it. The runner has no VS Code, so a do-nothing `code` is all
        # they need to find one.
        run: |
          mkdir -p "$RUNNER_TEMP/editor-stub"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/editor-stub/code"
          chmod +x "$RUNNER_TEMP/editor-stub/code"
          echo "$RUNNER_TEMP/editor-stub" >> "$GITHUB_PATH"
      - name: pytest
        env:
          PYTHONUTF8: "1"
          # Any request past this machine hits a dead proxy and fails the test here, instead of passing by luck or
          # reaching a paid API. Local servers the tests start on 127.0.0.1 are not proxied.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
        run: python -m pytest server cli/tests evals/replay -q -p no:cacheprovider --timeout=120 -ra
  cloud:
    # miyagi-cloud as Render installs it (cloud/requirements.txt, Python 3.12 as in render.yaml). cloud/ has no test
    # suite on this branch yet, so this is a smoke: it starts, /healthz answers, and the proxy and admin routes refuse a
    # request without a token. In process (TestClient): no upstream key, nothing leaves the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: cloud } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: cloud/requirements.txt }
      - run: pip install -r requirements.txt
      - name: smoke
        env:
          DB_PATH: ${{ runner.temp }}/miyagi-cloud.db
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,testserver
        run: |
          # The app refuses to start without an admin token: a throwaway one, made here and never printed.
          export ADMIN_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(16))')"
          python - <<'EOF'
          from fastapi.testclient import TestClient
          import app
          with TestClient(app.app) as c:
              r = c.get("/healthz")
              assert r.status_code == 200 and r.json()["ok"] is True, r.status_code
              body = {"model": "claude-x", "max_tokens": 1, "messages": [{"role": "user", "content": "hi"}]}
              assert c.post("/v1/anthropic/messages", json=body).status_code == 401
              assert c.get("/admin/usage").status_code == 401
          print("cloud smoke: ok")
          EOF
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # typecheck, build and the tests never start Electron
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - name: no secret Supabase keys in app/ or the build env (R46)
        run: python3 scripts/check_supabase_keys.py --self-test && python3 scripts/check_supabase_keys.py --env app
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: no secret Supabase keys in the built app (R46)
        run: python3 scripts/check_supabase_keys.py app/out
      - name: VS Code companion tests
        run: npm test
        working-directory: vscode-ext
  gitleaks:
    # Every commit the branch carries, not only the PR's: a key pushed once stays in the history (R46). Findings print
    # redacted. A finding checked by hand and not a secret goes in .gitleaksignore; .gitleaks.toml holds the config.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: gitleaks 8.30.1 (checksum checked)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_TGZ_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_TGZ_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=HEAD --redact --no-banner -v
      - name: no merge-conflict markers
        run: |
          if git grep -nIE '^(<<<<<<<|>>>>>>>)( |$)'; then echo "merge-conflict markers above"; exit 1; fi
  mac-build:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: |
          if [ -f app/package.json ]; then
            # The engine goes inside the app (Resources/engine), as `npm run ship:mac` does: this commit's server/ plus the
            # installer from claude/distribution (main has no scripts/install.sh yet). localEngine.ts installs it on first launch.
            git fetch --no-tags --depth=1 origin +refs/heads/claude/distribution:refs/remotes/origin/claude/distribution
            cd app && npm ci && npm run build --if-present
            MIYAGI_ENGINE_REF=HEAD MIYAGI_INSTALL_REF=origin/claude/distribution node scripts/bundle-engine.mjs
            npx electron-builder --mac --dir --publish never
          else echo "no app yet"; fi
      - name: no secret Supabase keys in the build env or the built app (R46)
        run: python3 scripts/check_supabase_keys.py --env app/out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: hashFiles('app/dist/**') != ''
        with: { name: mac-app, path: app/dist/mac*/** }
      # The Mac download on miyagi.study. upload-artifact drops symlinks and the executable bit, so the
      # raw .app above can't run once downloaded: ad-hoc sign it and zip it with ditto, which keeps both.
      - name: zip for download
        if: hashFiles('app/dist/**') != ''
        continue-on-error: true
        run: |
          app_path=$(ls -d app/dist/mac*/Miyagi.app | head -1)
          echo "engine inside: $(cat "$app_path/Contents/Resources/engine/VERSION" 2>/dev/null || echo none)"
          codesign --force --deep --sign - "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" app/dist/Miyagi-Mac.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: hashFiles('app/dist/Miyagi-Mac.zip') != ''
        with: { name: mac-zip, path: app/dist/Miyagi-Mac.zip, compression-level: 0 }
  contract:
    # every event / card kind / card action / action kind in shared/contracts/events.ts must have a handler or label in app/src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: python3 scripts/test_check_contract.py
      # events.ts and events.py list the same events, commands and constants; the ui-v4 mock validates (Nov 24)
      - run: pip install "pydantic==2.14.3" && python3 scripts/test_contract_parity.py
      - run: python3 scripts/check_contract.py
