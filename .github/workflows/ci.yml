name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          if [ -f server/pyproject.toml ]; then pip install -e server[dev] && (ruff check server || true) && python -c "import server" ; else echo "no server yet"; fi
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          if [ -f app/package.json ]; then cd app && npm ci && npm run typecheck --if-present && npm run lint --if-present; else echo "no app yet"; fi
  mac-build:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          if [ -f app/package.json ]; then cd app && npm ci && npm run build --if-present && npx electron-builder --mac --dir --publish never; else echo "no app yet"; fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('app/dist/**') != ''
        with: { name: mac-app, path: app/dist/mac*/** }
