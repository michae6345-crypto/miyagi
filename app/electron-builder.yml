appId: dev.sandhacks.miyagi
productName: miyagi
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
mac:
  target: dir
  icon: build/icon.png
  category: public.app-category.education
  identity: null
  extendInfo:
    LSUIElement: true
win:
  target: nsis
  icon: build/icon.ico
# The Windows download on miyagi.study: one-click, per-user (no admin prompt), starts Miyagi when done.
# Stable file name so the site can link straight to it. Unsigned: SmartScreen asks once (More info > Run anyway).
nsis:
  artifactName: Miyagi-Windows-Setup.${ext}
  oneClick: true
  perMachine: false
  shortcutName: Miyagi
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
