appId: dev.sandhacks.miyagi
productName: miyagi
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
mac:
  target: dir
  icon: build/icon.png
  category: public.app-category.education
  identity: null
  extendInfo:
    LSUIElement: true
    # macOS shows these in the permission prompts (the app starts the engine, so the prompts name miyagi).
    NSScreenCaptureUsageDescription: miyagi reads your screen to check each step of the lesson.
    NSAppleEventsUsageDescription: miyagi opens your editor at the right file for each step.
  # The engine travels inside the app (scripts/bundle-engine.mjs makes build/engine); on first launch
  # main/localEngine.ts installs it to ~/miyagi/engine and starts it.
  extraResources:
    - from: build/engine
      to: engine
win:
  target: nsis
  icon: build/icon.ico
# The Windows download on miyagi.study: one-click, per-user (no admin prompt), starts Miyagi when done.
# Stable file name so the site can link straight to it. Unsigned: SmartScreen asks once (More info > Run anyway).
nsis:
  artifactName: Miyagi-Windows-Setup.${ext}
  oneClick: true
  perMachine: false
  shortcutName: Miyagi
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
# The Microsoft Store package (MSIX/AppX): npx electron-builder --win appx --x64 --publish never
#   -> dist/Miyagi-Store.appx. Unsigned on purpose: the Store signs it after certification, so Store installs get
# no SmartScreen or Smart App Control prompt. Tiles: build/appx (scripts/make-store-tiles.py). The three ★ values
# must be copied from Partner Center > the app > Product identity once the name is reserved; until then they are
# placeholders and the package can't be uploaded. Steps: STORE.md.
appx:
  artifactName: Miyagi-Store.${ext}
  identityName: Miyagi # ★ Package/Identity/Name
  publisher: CN=00000000-0000-0000-0000-000000000000 # ★ Package/Identity/Publisher
  publisherDisplayName: miyagi # ★ Package/Properties/PublisherDisplayName
  applicationId: Miyagi
  displayName: miyagi
  backgroundColor: '#FFFFFF'
  languages:
    - en-US
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  addAutoLaunchExtension: false
