[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "websockets>=12", "pydantic>=2.7",
  "httpx>=0.27", "python-dotenv>=1.0", "jsonschema>=4.22",
  "anthropic>=0.40", "google-genai>=1.0",
  "psycopg[binary]>=3.2",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = [".."]
include = ["server*"]
