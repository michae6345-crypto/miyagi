[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "websockets>=12", "pydantic>=2.7",
  "httpx>=0.27", "python-dotenv>=1.0", "jsonschema>=4.22",
  "anthropic>=2.8", "google-genai>=1.0",
  "watchdog>=4", "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'", "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'", "pyobjc-framework-ScreenCaptureKit>=10; sys_platform == 'darwin'",
  "rapidfuzz>=3", "pillow>=10", "youtube-transcript-api>=1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
tiger = ["psycopg[binary]>=3.2"]  # dev only (`uv sync --extra tiger`): --tiger checks, /stats, the psycopg tests. Never bundled.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = [".."]
include = ["server*"]
